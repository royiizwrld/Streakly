<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#cd5537" />
<title>You're offline — Habit Tracker</title>
<style>
  :root { color-scheme: light dark; --bg:#fff7f5; --fg:#2b1d19; --muted:#6f5f5a; --primary:#cd5537; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1513; --fg:#f6ece9; --muted:#b5a5a0; --primary:#e27a5c; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing:border-box; }
  main { max-width: 360px; text-align:center; }
  img { width:72px; height:72px; border-radius:18px; }
  h1 { font-size:1.6rem; margin:20px 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:12px 28px; min-height:48px;
    background:var(--primary); color:#fff; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="Habit Tracker logo" />
  <h1>You're offline</h1>
  <p>We can't reach the internet right now. Your habits are safe — reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>
